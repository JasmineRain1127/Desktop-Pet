name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run checks and tests
        run: npm run check

      - name: Audit npm dependencies
        run: npm run security:audit

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Assemble release files
        shell: pwsh
        run: ./scripts/package-windows-release.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: desktop-pet-windows-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $releaseFiles = @(Get-ChildItem -LiteralPath "release" -File | Sort-Object Name | ForEach-Object FullName)
          if ($releaseFiles.Count -ne 3) {
            throw "Expected two executables and one checksum file, found $($releaseFiles.Count) release files."
          }
          $releaseArguments = @(
            $env:GITHUB_REF_NAME
          ) + $releaseFiles + @(
            "--verify-tag",
            "--title", "Desktop Pet $version",
            "--generate-notes"
          )
          if ($version.Contains("-")) {
            $releaseArguments += "--prerelease"
          }
          gh release create @releaseArguments
