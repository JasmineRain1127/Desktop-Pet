name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows desktop package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hasErrors = $false
          Get-ChildItem -LiteralPath "scripts" -Filter "*.ps1" -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            foreach ($parseError in $parseErrors) {
              Write-Error "$($_.Name): $($parseError.Message)"
              $hasErrors = $true
            }
          }
          if ($hasErrors) {
            throw "PowerShell syntax validation failed."
          }

      - name: Run checks and tests
        run: npm run check

      - name: Audit npm dependencies
        run: npm run security:audit

      - name: Check Tauri CLI
        run: npm run tauri -- --version

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Tauri Windows executable and NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Assemble release candidate
        shell: pwsh
        run: ./scripts/package-windows-release.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Smoke test NSIS install and uninstall
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -InstallerPath "release/Desktop-Pet_${{ steps.version.outputs.version }}_x64-setup.exe"

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v7
        with:
          name: desktop-pet-windows-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
